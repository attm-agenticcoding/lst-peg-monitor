name: snapshot

# 节奏：一个 run 在 runner 上循环约 5.5 小时、每 10 分钟取一次快照，结束前用 workflow_dispatch 接力下一个 run。
# GITHUB_TOKEN 触发的事件里，workflow_dispatch 是少数会真正起新 run 的，所以接力链不需要任何私钥。
#
# 为什么不用 cron：GitHub 的 schedule 是 best-effort，拥堵时直接丢弃。实测「每 30 分钟」的 cron
# 实际 2–5.5 小时才触发一次（中位约 4 小时）。所以 schedule 在这里只当看门狗 ——
# 接力链意外断了（runner 挂掉、GitHub 故障）才由它重新拉起；链在跑时 gate 直接放行为空转。
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/snapshot.yml/runs?per_page=30" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .status != "completed")] | length')
          echo "其他未结束的 run：$n"
          if [ "$n" = "0" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi

  loop:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: snapshot-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        run: node tests/core.test.js
        continue-on-error: true
      - name: snapshot loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/loop.sh
