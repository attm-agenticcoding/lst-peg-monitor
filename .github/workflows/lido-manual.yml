name: Lido twice-daily and explicit manual refresh

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  push:
    branches: [main]
    paths: ['.github/lido-manual-request.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Explicit manual request or scheduled relay fallback'
        type: choice
        options: [manual, scheduled]
        default: manual
      attempt_slot:
        description: 'Relay UTC slot, YYYY-MM-DDT00:00:00Z or YYYY-MM-DDT12:00:00Z'
        type: string
      relay_run_id:
        description: 'Sending snapshot workflow run (scheduled mode only)'
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: lido-explicit-manual
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'attm-agenticcoding/lst-peg-monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run one scheduled slot or explicit manual attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lido/actions_controller.py
