name: Lido daily and explicit manual refresh

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths: ['.github/lido-manual-request.json']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: lido-explicit-manual
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'attm-agenticcoding/lst-peg-monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run one daily or explicit manual attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lido/actions_controller.py
